# =============================================
# LOCAL MODE - prometheus.yml
# make up-local ile kullanılır
# =============================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - ./alert_rules.yml

scrape_configs:

  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9091"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"