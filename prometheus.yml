global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - ./alert_rules.yml

scrape_configs:

  # 🚀 FastAPI (LOCAL)
  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]

  # 🧠 Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]


alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"