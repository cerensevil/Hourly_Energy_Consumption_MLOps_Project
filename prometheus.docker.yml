# =============================================
# DOCKER MODE - prometheus.docker.yml
# docker-compose.yml tarafından kullanılır
# =============================================
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:

  - job_name: "fastapi"
    metrics_path: /metrics
    static_configs:
      - targets: ["ml_ops_app:8000"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"